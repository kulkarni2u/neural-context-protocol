name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  minimum-python-import:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up minimum Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: python -m pip install .

      - name: Import package
        run: python -c "import ncp; print(ncp.__version__)"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package, provider, and dev dependencies
        run: python -m pip install -e '.[dev,providers]'

      - name: Lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -p no:cacheprovider tests

      - name: Benchmark gates
        run: |
          python benchmarks/coding_pipeline/run.py --turns 40 | python -c "import json,sys; artifact=json.load(sys.stdin); summary=artifact['summary']; assert summary['pass'], summary; print('coding gate OK', summary['reduction_factor'])"
          python benchmarks/needle/run.py --turns 24 --needles 6 --budget 4 | python -c "import json,sys; artifact=json.load(sys.stdin); assert artifact['summary']['ncp_beats_sliding_window'], artifact['summary']; print('needle gate OK')"

      - name: Build artifacts
        run: python -m build

  pgvector-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ncp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ncp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package with pgvector, redis, and dev dependencies
        run: python -m pip install -e '.[pgvector,redis,dev]' psycopg2-binary

      - name: Run pgvector, migration, and coordination integration tests
        env:
          NCP_RUN_PGVECTOR_INTEGRATION: "1"
          NCP_PGVECTOR_DSN: "postgresql://postgres:postgres@127.0.0.1:5432/ncp"
          NCP_REDIS_URL: "redis://127.0.0.1:6379/0"
        run: >-
          python -m pytest -p no:cacheprovider
          tests/test_pgvector_bitemporal.py
          tests/test_pgvector_integration.py
          tests/test_migrations.py
          tests/test_retrieval_feedback.py
          tests/test_async_redis_coordination.py

name: Release

on:
  push:
    tags:
      - "v*"
  # Re-publish an existing tag when its tag-push run is stuck or failed.
  # The workflow definition comes from the branch you dispatch from; the code
  # that is built, tested and published is the tag's.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish (e.g. v1.9.3)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate dispatched tag
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-]?[A-Za-z0-9.]+)?$ ]]; then
            echo "Input tag '$INPUT_TAG' is not a release tag like v1.2.3."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          package_version="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"

          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version ($tag_version) does not match package version ($package_version)."
            exit 1
          fi

      - name: Install package, provider, and dev dependencies
        run: python -m pip install -e '.[dev,providers]'

      - name: Run release preflight
        run: bash scripts/release_preflight.sh

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

# ~/.codex/config.toml (or a project-scoped Codex config): register NCP's
# streamable HTTP MCP endpoint. Same endpoint as examples/07_codex_cli
# (which ships it as JSON in mcp_servers.json); the ontology needs nothing
# Codex-specific.

[mcp_servers.ncp]
url = "http://127.0.0.1:4242/mcp"
# With [server].auth_token or [principals] configured on ncp serve:
# bearer_token_env_var = "NCP_AUTH_TOKEN"
